<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrustVault - My Vault</title>
<style>
  *{box-sizing:border-box;font-family:Inter,Arial,sans-serif}
  body{margin:0;background:#0f172a;color:#fff;min-height:100vh;padding:20px}
  .wrap{max-width:520px;margin:0 auto}
  .card{background:#fff;color:#111;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  h2{margin:0 0 14px;font-size:22px}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tabs button{flex:1;padding:10px;border:0;border-radius:10px;cursor:pointer;font-weight:700;background:#e2e8f0}
  .tabs button.active{background:#2563eb;color:#fff}
  input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;margin-bottom:10px;font-size:15px}
  .btn{width:100%;padding:13px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:800;cursor:pointer;font-size:15px}
  .btn.green{background:#0891b2}
  .btn.dark{background:#111827}
  .msg{margin:10px 0;font-weight:600;font-size:14px}
  .msg.ok{color:#15803d}
  .msg.err{color:#dc2626}
  .small{font-size:13px;color:#64748b;text-align:center;margin-top:8px}
  .row{display:flex;gap:8px}
  .row button{padding:7px 12px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;cursor:pointer}
  .doc{border-top:1px solid #e2e8f0;padding:12px 0}
  .doc b{display:block}
  .link{color:#2563eb;text-decoration:none;font-weight:700}
  .log{border-top:1px solid #e2e8f0;padding:8px 0;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div style="text-align:center;margin-bottom:16px">
    <h1 style="margin:0">🔐 TrustVault</h1>
    <p style="color:#cbd5e1;margin:6px 0 0">Your Documents. Only Your People.</p>
    <a class="link" href="/">← Back to Home</a>
  </div>

  <div class="card">
    <h2>Welcome to Your Vault</h2>
    <div class="tabs">
      <button id="tabLogin" class="active" onclick="showTab('login')">Login</button>
      <button id="tabRegister" onclick="showTab('register')">Register</button>
    </div>
    <div id="loginBox">
      <input id="loginEmail" type="email" placeholder="Email - ex: sonia@gmail.com">
      <input id="loginPassword" type="password" placeholder="Password">
      <button class="btn" onclick="doLogin()">Login →</button>
      <div class="small">Demo: sonia@test.com / password123</div>
    </div>
    <div id="registerBox" style="display:none">
      <input id="regName" type="text" placeholder="Full Name - ex: Shaik Sonia">
      <input id="regEmail" type="email" placeholder="Email - ex: sonia@gmail.com">
      <input id="regPassword" type="password" placeholder="Password">
      <button class="btn" onclick="doRegister()">Create Account</button>
    </div>
    <div id="authMsg" class="msg"></div>
    <button class="btn" style="background:#f1f5f9;color:#111;margin-top:6px" onclick="doLogout()">Logout & Revoke Token</button>
    <button class="btn" style="background:#f1f5f9;color:#111;margin-top:6px" onclick="loadDocs()">Refresh My Documents</button>
  </div>

  <div class="card">
    <h2>My Documents</h2>
    <input id="searchBox" placeholder="Search - ex: resume" oninput="loadDocs()">
    <input id="fileInput" type="file">
    <button class="btn green" onclick="doUpload()">Upload Document</button>
    <div id="uploadMsg" class="msg"></div>
    <div id="docList"></div>
  </div>

  <div class="card">
    <h2>Audit Log</h2>
    <p class="small" style="text-align:left;margin:0 0 10px">Only Admin can view audit log. Login as Admin to see all actions.</p>
    <button class="btn dark" onclick="loadAudit()">View Audit Log</button>
    <div id="auditMsg" class="msg"></div>
    <div id="auditList"></div>
  </div>
</div>

<script>
let token = localStorage.getItem('trustvault_token') || '';
function showTab(t){
  document.getElementById('loginBox').style.display = t==='login' ? 'block':'none';
  document.getElementById('registerBox').style.display = t==='register' ? 'block':'none';
  document.getElementById('tabLogin').classList.toggle('active', t==='login');
  document.getElementById('tabRegister').classList.toggle('active', t==='register');
}
function showMsg(id, text, ok){
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok':'err');
}
async function doRegister(){
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  if(!name || !email || !password){ showMsg('authMsg','Please fill all fields',false); return; }
  try{
    const params = new URLSearchParams({name, email, password});
    const r = await fetch('/auth/register?' + params.toString(), {method:'POST'});
    const d = await r.json();
    showMsg('authMsg', d.message || 'Account created! Please Login now', true);
    if(d.message && d.message.includes('created')) showTab('login');
  }catch(e){ showMsg('authMsg','Network error: ' + e.message, false); }
}
async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if(!email || !password){ showMsg('authMsg','Please enter email and password',false); return; }
  try{
    const params = new URLSearchParams({email, password});
    const r = await fetch('/auth/login?' + params.toString(), {method:'POST'});
    const d = await r.json();
    if(!r.ok){ showMsg('authMsg', d.detail || 'Invalid email or password', false); return; }
    token = d.access_token;
    localStorage.setItem('trustvault_token', token);
    showMsg('authMsg','Login Success! Documents loading...', true);
    loadDocs();
  }catch(e){ showMsg('authMsg','Network error: ' + e.message, false); }
}
async function doLogout(){
  try{ if(token) await fetch('/auth/logout', {method:'POST', headers:{'Authorization':'Bearer ' + token}}); }catch(e){}
  token = '';
  localStorage.removeItem('trustvault_token');
  showMsg('authMsg','Logged out', true);
  document.getElementById('docList').innerHTML = '';
  document.getElementById('auditList').innerHTML = '';
}
async function loadDocs(){
  if(!token) return;
  const search = document.getElementById('searchBox').value.trim();
  let url = '/documents/?';
  if(search) url += 'search=' + encodeURIComponent(search);
  try{
    const r = await fetch(url, {headers:{'Authorization':'Bearer ' + token}});
    const d = await r.json();
    if(!r.ok){ showMsg('authMsg', d.detail || 'Not authenticated', false); return; }
    const list = document.getElementById('docList');
    if(!d.length){ list.innerHTML = '<p class="small">No documents found. Upload a document.</p>'; return; }
    list.innerHTML = d.map(doc => `
      <div class="doc">
        <b>${doc.filename}</b>
        <span class="small">ID: ${doc.id}</span>
        <div class="row" style="margin-top:8px">
          <button onclick="doDownload(${doc.id},'${doc.filename}')">Download</button>
          <button onclick="doShare(${doc.id})">Share</button>
          <button onclick="doUnshare(${doc.id})">Unshare</button>
        </div>
      </div>
    `).join('');
  }catch(e){ showMsg('authMsg','Network error: ' + e.message, false); }
}
async function doUpload(){
  const f = document.getElementById('fileInput').files[0];
  if(!f){ showMsg('uploadMsg','Please choose a file first', false); return; }
  if(!token){ showMsg('uploadMsg','Please login first', false); return; }
  const fd = new FormData();
  fd.append('file', f);
  try{
    const r = await fetch('/documents/upload', {method:'POST', headers:{'Authorization':'Bearer ' + token}, body: fd});
    const d = await r.json();
    if(!r.ok){ showMsg('uploadMsg', d.detail || 'Upload failed', false); return; }
    showMsg('uploadMsg','Upload Success: ' + d.filename, true);
    loadDocs();
  }catch(e){ showMsg('uploadMsg','Network error: ' + e.message, false); }
}
async function doDownload(id, filename){
  try{
    const r = await fetch('/documents/' + id + '/download', {headers:{'Authorization':'Bearer ' + token}});
    if(!r.ok){ alert('Download failed'); return; }
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
  }catch(e){ alert('Download failed: ' + e.message); }
}
async function doShare(id){
  const email = prompt('Enter email to share with:');
  if(!email) return;
  const params = new URLSearchParams({user_email: email});
  const r = await fetch('/documents/' + id + '/share?' + params.toString(), {method:'POST', headers:{'Authorization':'Bearer ' + token}});
  const d = await r.json();
  alert(d.message || d.detail || 'Shared');
  loadDocs();
}
async function doUnshare(id){
  const email = prompt('Enter email to unshare:');
  if(!email) return;
  const params = new URLSearchParams({user_email: email});
  const r = await fetch('/documents/' + id + '/share?' + params.toString(), {method:'DELETE', headers:{'Authorization':'Bearer ' + token}});
  const d = await r.json();
  alert(d.message || d.detail || 'Unshared');
  loadDocs();
}
async function loadAudit(){
  if(!token){ showMsg('auditMsg','Please login as Admin first', false); return; }
  try{
    const r = await fetch('/audit/', {headers:{'Authorization':'Bearer ' + token}});
    const d = await r.json();
    if(!r.ok){ showMsg('auditMsg', d.detail || 'Admin only - Please login as Admin', false); return; }
    if(!d.length){ showMsg('auditMsg','No audit logs yet', true); return; }
    showMsg('auditMsg','Audit Log loaded - ' + d.length + ' records', true);
    document.getElementById('auditList').innerHTML = d.map(l => `
      <div class="log"><b>${l.action}</b> - ${l.user_email || ''} - Doc: ${l.doc_id || '-'} - ${l.timestamp || ''}</div>
    `).join('');
  }catch(e){ showMsg('auditMsg','Network error: ' + e.message, false); }
}
if(token) loadDocs();
</script>
</body>
</html>
